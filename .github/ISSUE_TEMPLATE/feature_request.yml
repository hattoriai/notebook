name: Feature request
description: An idea, or a change to what Notebook does.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. A new feature or a change of behaviour is agreed here before a pull request (see CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, for whom, and what stops you today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it would look to the people using the notebook and to its admins. Say if it needs a migration, a new setting or environment variable, or a new dependency.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What else you considered
      description: Other designs, and what you do today instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the open and closed issues.
          required: true
        - label: I would like to make the pull request myself.
